server:
  port: 8072

spring:
  application:
    name: "api-gateway"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: order-service
          uri: lb://order
          predicates:
            - Path=/api/orders/**

        - id: inventory-service
          uri: lb://inventory
          predicates:
            - Path=/api/inventory/**

        - id: payment-service
          uri: lb://payment
          predicates:
            - Path=/api/payments/**

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

info:
  app:
    name: "api-gateway"
    description: "API Gateway for E-Commerce"
    version: "1.0.0"

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"